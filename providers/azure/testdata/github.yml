name: CI
on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
env:
  GO_VERSION: "1.22"
  API_URL: https://api.example.com
  TOKEN: ${{ secrets.API_TOKEN }}
jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]
        exclude:
          - os: windows-latest
            node: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci && npm test
        env:
          CI_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/
            coverage/lcov.info
  test:
    needs: build
    runs-on: ubuntu-22.04
    container: golang:1.22
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        run: |
          go test ./... -run "$PATTERN"
          curl -H "Authorization: ${{ secrets.DEPLOY_KEY }}" $API_URL
        working-directory: src
        env:
          PATTERN: Test.*
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
      - uses: docker/login-action@v3
        with:
          username: bob
      - run: Write-Host "hi ${{ github.ref_name }}"
        shell: pwsh
        if: failure()
  deploy:
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, deployer]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest
      - run: ./deploy.sh ${{ secrets.DEPLOY_KEY }}
