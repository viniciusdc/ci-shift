stages: [build, test, deploy]
variables:
  GLOBAL: "1"
default:
  image: golang:1.22
cache:
  key:
    files: [go.sum]
  paths: [.cache/go]
build:
  stage: build
  script:
    - go build ./...
  artifacts:
    paths: [bin/]
    expire_in: 1 week
test:
  stage: test
  services:
    - name: redis:7
      alias: cache
  variables:
    GIT_DEPTH: "10"
  script:
    - go test ./... -run $CI_COMMIT_SHA
  after_script:
    - echo done
  parallel:
    matrix:
      - GOOS: [linux, darwin]
vet:
  stage: test
  image: golang:1.21
  script: [go vet ./...]
  allow_failure: true
deploy:
  stage: deploy
  script: ./deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment: production
release:
  stage: deploy
  script: echo release $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
mr:
  stage: test
  script: echo mr
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
