name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release with the newest Go and its security fixes; go.mod only sets
      # the oldest Go that builds ci-shift. go-licenses, run by GoReleaser,
      # needs Go 1.23: on an older Go it is built by a downloaded toolchain
      # and then fails to recognize the standard library.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
