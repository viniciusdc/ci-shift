version: 2

project_name: cishift

before:
  hooks:
    - go mod tidy
    # Collect dependency licenses for the archives. The Windows build links
    # the most packages (cobra's mousetrap), so its set covers every target.
    - sh -c 'GOBIN="$PWD/.bin" go install github.com/google/go-licenses/v2@v2.0.1'
    - sh -c 'GOOS=windows .bin/go-licenses save ./cmd/cishift --save_path=third_party --ignore=github.com/viniciusdc/ci-shift --force'

builds:
  - main: ./cmd/cishift
    binary: cishift
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/viniciusdc/ci-shift/internal/buildinfo.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - schema/snapshots/README.md
      - schema/snapshots/licenses/*
      - third_party/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # A tag such as v0.1.0-rc.1 becomes a pre-release, which GitHub never
  # marks as latest, so `cishift version --check` does not offer it.
  prerelease: auto
