# Converted by ci-shift from bitbucket/full (Bitbucket Pipelines) to GitLab CI/CD.
# Review before use; 4 item(s) need attention:
#   - pipelines.custom: custom pipelines run manually or from schedules configured in Repository settings > Pipelines > Schedules; schedules are not stored in the file and were not converted
#   - pipelines.branches.main[1].stage.steps[0].step.script[1]: Bitbucket pipe "atlassian/slack-notify:2.1.0" only exists on Bitbucket Pipelines
#   - pipelines.custom.deploy-staging[0].variables: custom pipeline variables are prompted at run time and were dropped
#   - main-publish.steps[3]: bitbucket step "atlassian/slack-notify:2.1.0" has no GitLab equivalent; a failing placeholder command was emitted

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^.*$/
    - if: $CI_COMMIT_TAG =~ /^v.*$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
stages:
  - stage-1
  - stage-2
default-build:
  stage: stage-1
  image: node:20
  needs: []
  variables:
    GIT_DEPTH: '5'
  cache:
    - key: node
      paths:
        - node_modules
    - key:
        files:
          - package-lock.json
        prefix: npm-cache
      paths:
        - ~/.npm
  script:
    - npm ci
    - npm run build -- --sha ${CI_COMMIT_SHA}
  artifacts:
    paths:
      - dist/**
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  timeout: 30m
default-unit-tests:
  stage: stage-2
  image: node:20
  services:
    - name: postgres:16
      variables:
        POSTGRES_PASSWORD: example
  needs:
    - default-build
  variables:
    GIT_DEPTH: '5'
  script:
    - npm test -- --token ${NPM_TOKEN}
  after_script:
    - echo "exit code $BITBUCKET_EXIT_CODE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  timeout: 30m
default-lint:
  stage: stage-2
  image: node:20
  needs:
    - default-build
  variables:
    GIT_DEPTH: '5'
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  timeout: 30m
main-build:
  stage: stage-1
  image: node:20
  needs: []
  variables:
    GIT_DEPTH: '5'
  cache:
    - key: node
      paths:
        - node_modules
    - key:
        files:
          - package-lock.json
        prefix: npm-cache
      paths:
        - ~/.npm
  script:
    - npm ci
    - npm run build -- --sha ${CI_COMMIT_SHA}
  artifacts:
    paths:
      - dist/**
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  timeout: 30m
main-publish:
  stage: stage-2
  image: node:20
  needs:
    - main-build
  variables:
    GIT_DEPTH: '5'
  script:
    - npm publish
    - 'echo "ci-shift: port bitbucket step ''atlassian/slack-notify:2.1.0'' manually" && exit 1'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - linux
    - big
  timeout: 1h
  environment: production
tag-v-tag-build:
  stage: stage-1
  image: node:22
  needs: []
  variables:
    GIT_DEPTH: '5'
  script:
    - echo "${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
  timeout: 30m
pr-pr-check:
  stage: stage-1
  image: node:20
  needs: []
  variables:
    GIT_DEPTH: '0'
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 30m
deploy-staging-build:
  stage: stage-1
  image: node:20
  needs: []
  variables:
    GIT_DEPTH: '5'
  cache:
    - key: node
      paths:
        - node_modules
    - key:
        files:
          - package-lock.json
        prefix: npm-cache
      paths:
        - ~/.npm
  script:
    - npm ci
    - npm run build -- --sha ${CI_COMMIT_SHA}
  artifacts:
    paths:
      - dist/**
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  timeout: 30m
deploy-staging-deploy:
  stage: stage-2
  image: node:20
  needs:
    - deploy-staging-build
  variables:
    GIT_DEPTH: '5'
  script:
    - ./deploy.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  timeout: 30m
  environment: staging
