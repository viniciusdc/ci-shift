#   - jobs.deploy-staging-build.steps[4]: store_artifacts takes a file or directory; pattern "dist/**" was widened to "dist"
#   - jobs.deploy-staging-build: CircleCI has no job timeout; the 30 minute limit was dropped (steps fail after 10 minutes without output)
