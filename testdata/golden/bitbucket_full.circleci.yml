version: 2.1
jobs:
  # Build
  default-build:
    docker:
      - image: node:20
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - restore_cache:
          keys:
            - node-
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run: |-
          npm ci
          npm run build -- --sha ${CIRCLE_SHA1}
      - persist_to_workspace:
          root: .
          paths:
            - dist/**
      - store_artifacts:
          path: dist
      - save_cache:
          key: node-{{ epoch }}
          paths:
            - node_modules
      - save_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
  # Unit tests
  default-unit-tests:
    docker:
      - image: node:20
      - image: postgres:16
        name: postgres
        environment:
          POSTGRES_PASSWORD: example
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - attach_workspace:
          at: .
      - run: npm test -- --token ${NPM_TOKEN}
      - run:
          command: echo "exit code $BITBUCKET_EXIT_CODE" || true
          when: always
  # Lint
  default-lint:
    docker:
      - image: node:20
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - attach_workspace:
          at: .
      - run: npm run lint
  # Build
  main-build:
    docker:
      - image: node:20
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - restore_cache:
          keys:
            - node-
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run: |-
          npm ci
          npm run build -- --sha ${CIRCLE_SHA1}
      - persist_to_workspace:
          root: .
          paths:
            - dist/**
      - store_artifacts:
          path: dist
      - save_cache:
          key: node-{{ epoch }}
          paths:
            - node_modules
      - save_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
  # Publish
  main-publish:
    machine: true
    resource_class: linux
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - attach_workspace:
          at: .
      - run: npm publish
      - run: 'echo "cistela: port bitbucket step ''atlassian/slack-notify:2.1.0'' manually" && exit 1'
  # Tag build
  tag-v-tag-build:
    docker:
      - image: node:22
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - run: echo "${CIRCLE_TAG}"
  # PR check
  pr-pr-check:
    docker:
      - image: node:20
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - run: npm test
  # Build
  deploy-staging-build:
    docker:
      - image: node:20
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - restore_cache:
          keys:
            - node-
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run: |-
          npm ci
          npm run build -- --sha ${CIRCLE_SHA1}
      - store_artifacts:
          path: dist
      - save_cache:
          key: node-{{ epoch }}
          paths:
            - node_modules
      - save_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
  # Deploy
  deploy-staging-deploy:
    docker:
      - image: node:20
    steps:
      - checkout
      - run:
          name: Fetch LFS objects
          command: git lfs pull
      - run: ./deploy.sh
workflows:
  main:
    jobs:
      - default-build:
          filters:
            tags:
              only: /^v.*$/
      - default-unit-tests:
          requires:
            - default-build
          filters:
            tags:
              only: /^v.*$/
      - default-lint:
          requires:
            - default-build
          filters:
            tags:
              only: /^v.*$/
      - main-build:
          filters:
            branches:
              only: main
      - main-publish:
          requires:
            - main-build
          filters:
            branches:
              only: main
      - tag-v-tag-build:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*$/
      - pr-pr-check:
          filters:
            tags:
              only: /^v.*$/
      - deploy-staging-build:
          filters:
            tags:
              only: /^v.*$/
      - hold-deploy-staging-deploy:
          type: approval
          requires:
            - deploy-staging-build
          filters:
            tags:
              only: /^v.*$/
      - deploy-staging-deploy:
          requires:
            - hold-deploy-staging-deploy
          filters:
            tags:
              only: /^v.*$/
