# Converted by ci-shift from github/node-app (GitHub Actions) to GitLab CI/CD.
# Review before use; 2 item(s) need attention:
#   - workflow: create a pipeline schedule in GitLab (Build > Pipeline schedules) for cron 0 3 * * 1
#   - deploy.steps[2]: github step "slackapi/slack-github-action@v1" has no GitLab equivalent; a failing placeholder command was emitted

workflow:
  name: Node app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
    - if: $CI_COMMIT_TAG =~ /^v.*$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
stages:
  - lint
  - test
  - build
  - deploy
variables:
  NODE_ENV: test
  REGISTRY: ghcr.io
lint:
  stage: lint
  image: node:20
  needs: []
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - ~/.npm
  script:
    - npm ci
    - npm run lint
test:
  stage: test
  image: node:${node}
  services:
    - name: postgres:16
      variables:
        POSTGRES_PASSWORD: postgres
  needs:
    - lint
  variables:
    GIT_DEPTH: '0'
  script:
    - npm ci
    - |-
      # Run tests
      (
        export DATABASE_URL=postgres://postgres:postgres@localhost:5432/app
        npm test -- --coverage
      )
  artifacts:
    name: coverage-${node}
    paths:
      - coverage/
    expire_in: 7 days
    when: always
  parallel:
    matrix:
      - node: ['18', '20']
        os: [linux]
  timeout: 20m
build:
  stage: build
  image: node:20
  needs:
    - test
  script:
    - npm ci
    - npm run build
    - echo "Built ${CI_COMMIT_SHA} on ${CI_COMMIT_REF_NAME}"
  artifacts:
    name: dist
    paths:
      - dist
deploy:
  stage: deploy
  needs:
    - build
  variables:
    GIT_STRATEGY: none
  script:
    - ./scripts/deploy.sh dist "${DEPLOY_TOKEN}"
    - 'echo "ci-shift: port github step ''slackapi/slack-github-action@v1'' manually" && exit 1'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment: production
