# How cishift converts between providers: every provider parses into one
# shared pipeline model and emits out of it. Rendered by
# internal/tools/gendiagram into docs/assets/diagrams/.
#
# Explicit layout: providers sit 40px apart on both sides; the three stages
# share the center row (y=150), level with the middle provider.

title  = "ci-shift — one pipeline model between five providers"
width  = 850
height = 290
scale  = 1.2

# ── Sources ──────────────────────────────────────────────────────────────────

[[nodes]]
id = "src_github"
label = "GITHUB ACTIONS"
style = "source"
x = 22
y = 70

[[nodes]]
id = "src_gitlab"
label = "GITLAB CI/CD"
style = "source"
x = 22
y = 110

[[nodes]]
id = "src_circleci"
label = "CIRCLECI"
style = "source"
x = 22
y = 150

[[nodes]]
id = "src_azure"
label = "AZURE PIPELINES"
style = "source"
x = 22
y = 190

[[nodes]]
id = "src_bitbucket"
label = "BITBUCKET PIPELINES"
style = "source"
x = 22
y = 230

